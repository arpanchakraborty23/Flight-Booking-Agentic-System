name: Docker Build, Push to ECR, and Deploy to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flight-booking-system

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Git metadata
        id: meta
        run: |
          echo "SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=$(echo ${{ github.ref }} | sed 's|refs/heads/||')" >> $GITHUB_OUTPUT

      - name: Build and push frontend API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-api-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-api-${{ steps.meta.outputs.SHA_SHORT }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-api-${{ steps.meta.outputs.BRANCH_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push voice agent image
        uses: docker/build-push-action@v5
        with:
          context: ./voice_agent
          file: ./voice_agent/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:voice-agent-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:voice-agent-${{ steps.meta.outputs.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push planner agent image
        uses: docker/build-push-action@v5
        with:
          context: ./planner_agent
          file: ./planner_agent/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:planner-agent-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:planner-agent-${{ steps.meta.outputs.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push MCP server image
        uses: docker/build-push-action@v5
        with:
          context: ./mcp
          file: ./mcp/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:mcp-server-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:mcp-server-${{ steps.meta.outputs.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp docker-compose.yml deploy/
          cp .env.example deploy/env.template
          cat > deploy/deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          # Load environment variables
          if [ -f .env ]; then
            export $(cat .env | xargs)
          fi
          
          # Login to ECR
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          
          # Pull latest images
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-latest
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:voice-agent-latest
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:planner-agent-latest
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:mcp-server-latest
          
          # Stop and remove existing containers
          docker-compose down
          
          # Start services
          docker-compose up -d
          
          # Wait for services to be healthy
          sleep 30
          
          # Check service health
          docker-compose ps
          
          # Clean up old images
          docker image prune -f
          
          echo "Deployment completed successfully!"
          EOF
          chmod +x deploy/deploy.sh

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-files
          path: deploy/
          retention-days: 7

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deployment-files
          path: deploy/

      - name: Create .env file
        run: |
          cat > deploy/.env << EOF
          MISTRAL_API_KEY="${{ secrets.MISTRAL_API_KEY }}"
          Amadeus_API_Key="${{ secrets.AMADEUS_API_KEY }}"
          Amadeus_API_Secret="${{ secrets.AMADEUS_API_SECRET }}"
          LANGFUSE_SECRET_KEY="${{ secrets.LANGFUSE_SECRET_KEY }}"
          LANGFUSE_PUBLIC_KEY="${{ secrets.LANGFUSE_PUBLIC_KEY }}"
          LANGFUSE_BASE_URL="${{ secrets.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}"
          LIVEKIT_API_KEY="${{ secrets.LIVEKIT_API_KEY }}"
          LIVEKIT_API_SECRET="${{ secrets.LIVEKIT_API_SECRET }}"
          LIVEKIT_URL="${{ secrets.LIVEKIT_URL }}"
          MONGODB_URI="${{ secrets.MONGODB_URI }}"
          REDIS_URL="${{ secrets.REDIS_URL }}"
          OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          EOF

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          source: "deploy/*"
          target: "/home/${{ secrets.EC2_USERNAME }}/flight-booking"

      - name: Execute deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/flight-booking/deploy
            
            # Make sure AWS credentials are available
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export AWS_REGION="${{ env.AWS_REGION }}"
            export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"
            
            # Execute deployment script
            echo "Starting deployment..."
            ./deploy.sh
            
            # Check deployment status
            echo "Deployment status:"
            docker-compose ps
            
            # Show logs for any failing services
            docker-compose logs --tail=50

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/flight-booking/deploy
            
            # Wait for services to be ready
            echo "Waiting for services to be ready..."
            sleep 30
            
            # Check if API is responding
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✓ API service is healthy"
            else
              echo "✗ API service is not responding"
              docker-compose logs api
              exit 1
            fi
            
            # Check all services
            docker-compose ps
            echo "✓ All services deployed successfully!"

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-ec2]
    if: always()
    
    steps:
      - name: Cleanup artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: deployment-files
          failOnError: false
