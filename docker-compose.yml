version: '3.8'

services:
  # Frontend API - serves the web UI and communicates with voice agent
  frontend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend-api
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - Amadeus_API_Key=${Amadeus_API_Key}
      - Amadeus_API_Secret=${Amadeus_API_Secret}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      - VOICE_AGENT_URL=http://voice-agent:8081
      - PLANNER_AGENT_URL=http://planner-agent:8082
      - MCP_SERVER_URL=http://mcp-server:8083
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./templates:/app/templates
      - ./frontend:/app/frontend
    restart: unless-stopped
    networks:
      - flight-booking-network
    depends_on:
      - voice-agent
      - planner-agent
      - mcp-server

  # Voice Agent Service
  voice-agent:
    build:
      context: ./voice_agent
      dockerfile: Dockerfile
    container_name: voice-agent
    ports:
      - "8081:8081"
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}
    env_file:
      - .env
    volumes:
      - ./voice_agent/logs:/app/logs
    restart: unless-stopped
    networks:
      - flight-booking-network

  # Planner Agent Service
  planner-agent:
    build:
      context: ./planner_agent
      dockerfile: Dockerfile
    container_name: planner-agent
    ports:
      - "8082:8082"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    env_file:
      - .env
    volumes:
      - ./planner_agent/logs:/app/logs
    restart: unless-stopped
    networks:
      - flight-booking-network

  # MCP Server
  mcp-server:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "8083:8083"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - Amadeus_API_Key=${Amadeus_API_Key}
      - Amadeus_API_Secret=${Amadeus_API_Secret}
    env_file:
      - .env
    volumes:
      - ./mcp/logs:/app/logs
    restart: unless-stopped
    networks:
      - flight-booking-network

networks:
  flight-booking-network:
    driver: bridge

volumes:
  logs:
    driver: local
