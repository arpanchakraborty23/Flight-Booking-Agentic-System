[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit>=1.1.8",
    "livekit-agents[deepgram,elevenlabs,noise-cancellation,sarvam,silero,turn-detector]~=1.5",
    "livekit-plugins-ai-coustics~=0.2",
    "pymongo>=4.17.0",
    "redis>=5.0.0",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "E402", "F401"]  # E501: Line too long, E402: load_dotenv(), F401: direct imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
